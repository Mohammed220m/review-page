<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم الخدمة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .stars-container {
            display: flex;
            justify-content: center;
            direction: ltr; /* لترتيب النجوم من اليسار لليمين */
            gap: 8px;
            margin-bottom: 20px;
        }
        .star {
            font-size: 40px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
            user-select: none;
        }
        .star:hover, .star.active {
            color: #ffca28;
            transform: scale(1.1);
        }
        #feedback-box {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.4s ease-in-out;
        }
        p.note {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: none;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #25D366;
        }
        .send-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .send-btn:hover {
            background-color: #1eb954;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">كيف كانت تجربتك معنا اليوم؟</h2>
    
    <!-- النجوم -->
    <div class="stars-container">
        <span class="star" onclick="rate(1)">★</span>
        <span class="star" onclick="rate(2)">★</span>
        <span class="star" onclick="rate(3)">★</span>
        <span class="star" onclick="rate(4)">★</span>
        <span class="star" onclick="rate(5)">★</span>
    </div>

    <!-- صندوق الملاحظات للتقييمات 3 أو أقل -->
    <div id="feedback-box">
        <p class="note">نأسف لعدم رضاك التام، يرجى إخبارنا بلاحظاتك لنتمكن من التحسين:</p>
        <textarea id="feedback-text" placeholder="اكتب ملاحظتك هنا..."></textarea>
        <button class="send-btn" onclick="sendFeedback()">إرسال الملاحظة للإدارة</button>
    </div>
</div>

<script>
    // ==========================================
    // إعدادات المحل
    // ==========================================
    const config = {
        // رابط تقييم قوقل المباشر للمحل
        googleReviewLink: "https://search.google.com/local/ChIJ9x7ku0SvST4Re6CKLuh3pYE",
        
        // رقم واتساب مالك المحل مع رمز الدولة (بدون + أو أصفار في البداية)
        whatsappNumber: "97336636050" 
    };

    let selectedRating = 0;
    const stars = document.querySelectorAll('.star');
    const feedbackBox = document.getElementById('feedback-box');

    function rate(starsCount) {
        selectedRating = starsCount;
        
        // تلوين النجوم المختارة
        stars.forEach((star, index) => {
            if (index < starsCount) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });

        // الشروط:
        // إذا اختار 4 أو 5 نجوم -> تحويل مباشر لقوقل
        if (starsCount >= 4) {
            feedbackBox.style.display = "none";
            setTimeout(() => {
                window.location.href = config.googleReviewLink;
            }, 300);
        } 
        // إذا اختار 3 أو أقل -> إظهار مربع كتابة الملاحظة
        else {
            feedbackBox.style.display = "block";
        }
    }

    function sendFeedback() {
        const text = document.getElementById('feedback-text').value.trim();
        if (!text) {
            alert("يرجى كتابة ملاحظتك قبل الإرسال.");
            return;
        }

        // تجهيز رسالة الواتساب
        const message = `مرحباً، لدي ملاحظة على الخدمة (تقييم ${selectedRating} من 5 نجوم):%0A${encodeURIComponent(text)}`;
        const whatsappUrl = `https://wa.me/${config.whatsappNumber}?text=${message}`;

        // التوجيه إلى الواتساب
        window.location.href = whatsappUrl;
    }
</script>

</body>
</html>
