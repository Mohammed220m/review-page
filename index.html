<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم الخدمة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .logo-placeholder {
            font-size: 45px;
            margin-bottom: 15px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 22px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .stars-container {
            display: flex;
            justify-content: center;
            direction: ltr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .star {
            font-size: 42px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
            user-select: none;
        }
        .star:hover, .star.active {
            color: #ffca28;
            transform: scale(1.15);
        }
        #feedback-box {
            display: none;
            margin-top: 20px;
            text-align: right;
            animation: fadeIn 0.4s ease-in-out;
        }
        p.note {
            color: #555;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            resize: none;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #ffca28;
        }
        .send-btn {
            background-color: #1a1a1a;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .send-btn:hover {
            background-color: #333333;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-placeholder">⭐</div>
    <h2 id="title">كيف كانت تجربتك معنا اليوم؟</h2>
    <p class="subtitle">رأيك يهمنا لتطوير خدماتنا باستمرار</p>
    
    <!-- النجوم -->
    <div class="stars-container">
        <span class="star" onclick="rate(1)">★</span>
        <span class="star" onclick="rate(2)">★</span>
        <span class="star" onclick="rate(3)">★</span>
        <span class="star" onclick="rate(4)">★</span>
        <span class="star" onclick="rate(5)">★</span>
    </div>

    <!-- صندوق الملاحظات للتقييمات 3 أو أقل -->
    <div id="feedback-box">
        <p class="note">يرجى توضيح سبب عدم رضاك لنتمكن من معالجته وتطوير الخدمة:</p>
        <textarea id="feedback-text" placeholder="اكتب ملاحظاتك هنا بكل شفافية..."></textarea>
        <button class="send-btn" onclick="sendFeedback()">إرسال الملاحظة للإدارة</button>
    </div>
</div>

<script>
    // ==========================================
    // إعدادات المحل والروابط
    // ==========================================
    const config = {
        // رابط تقييم قوقل المباشر (لـ 4 و 5 نجوم)
        googleReviewLink: "https://search.google.com/local/writereview?placeid=ChIJsbuai7OvST4RpLgV8m105B4",
        
        // ضع رابط Google Form الخاص بك بين علامتي التنصيص (لـ 1 و 2 و 3 نجوم)
        googleFormUrl: "https://docs.google.com/spreadsheets/d/1tpLG_x98aTsYjSs6QRGtqZEIAgsy1zzRSHQWys7umZg/edit?usp=sharing"
    };

    let selectedRating = 0;
    const stars = document.querySelectorAll('.star');
    const feedbackBox = document.getElementById('feedback-box');

    function rate(starsCount) {
        selectedRating = starsCount;
        
        // تلوين النجوم المختارة
        stars.forEach((star, index) => {
            if (index < starsCount) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });

        // إذا اختار 4 أو 5 نجوم -> تحويل مباشر لتقييم قوقل
        if (starsCount >= 4) {
            feedbackBox.style.display = "none";
            setTimeout(() => {
                window.location.href = config.googleReviewLink;
            }, 300);
        } 
        // إذا اختار 3 أو أقل -> إظهار مربع كتابة الملاحظة
        else {
            feedbackBox.style.display = "block";
        }
    }

    function sendFeedback() {
        const text = document.getElementById('feedback-text').value.trim();
        if (!text) {
            alert("يرجى كتابة ملاحظتك قبل الإرسال.");
            return;
        }

        // التوجيه إلى Google Form للحفظ في شيت الإكسل
        if (config.googleFormUrl && config.googleFormUrl !== "ضع_رابط_GOOGLE_FORM_هنا") {
            alert("شكراً لك! تم إرسال ملاحظتك إلى إدارة المحل بنجاح.");
            window.location.href = config.googleFormUrl;
        } else {
            alert("يرجى وضع رابط Google Form في الكود أولاً.");
        }
    }
</script>

</body>
</html>
